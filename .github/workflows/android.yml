name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TIMETABLE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > timetable-release.keystore

      - name: Build Release APK
        env:
          TIMETABLE_KEYSTORE_PASSWORD: ${{ secrets.TIMETABLE_KEYSTORE_PASSWORD }}
          TIMETABLE_KEY_ALIAS: ${{ secrets.TIMETABLE_KEY_ALIAS }}
          TIMETABLE_KEY_PASSWORD: ${{ secrets.TIMETABLE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/timetable-release.keystore" \
            -Pandroid.injected.signing.store.password="$TIMETABLE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$TIMETABLE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$TIMETABLE_KEY_PASSWORD"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: timetable-app-release
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error
