
name: Android CI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TIMETABLE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > timetable-release.keystore

      - name: Build Release APK
        env:
          TIMETABLE_KEYSTORE_PASSWORD: ${{ secrets.TIMETABLE_KEYSTORE_PASSWORD }}
          TIMETABLE_KEY_ALIAS: ${{ secrets.TIMETABLE_KEY_ALIAS }}
          TIMETABLE_KEY_PASSWORD: ${{ secrets.TIMETABLE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/timetable-release.keystore" \
            -Pandroid.injected.signing.store.password="$TIMETABLE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$TIMETABLE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$TIMETABLE_KEY_PASSWORD"

      - name: Prepare Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mapfile -t APK_FILES < <(
            find . -type f -path '*/build/outputs/apk/release/*.apk'
          )

          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#APK_FILES[@]}"
            printf '%s\n' "${APK_FILES[@]}"
            exit 1
          fi

          cp "${APK_FILES[0]}" \
            "timetable-app-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Timetable ${{ github.ref_name }}
          generate_release_notes: true
          files: timetable-app-${{ github.ref_name }}.apk
